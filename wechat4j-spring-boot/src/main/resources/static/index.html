<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WeChat4j - 微信客户端</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 90%;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1rem;
        }
        
        .login-section, .main-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 20px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: 600;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .qr-container {
            text-align: center;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .hidden {
            display: none;
        }
        
        .contacts-list, .messages-list {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            padding: 15px;
        }
        
        .contact-item, .message-item {
            padding: 10px;
            border-bottom: 1px solid #f1f3f4;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .contact-item:hover {
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WeChat4j</h1>
            <p>基于Spring Boot的微信客户端</p>
        </div>

        <!-- 登录区域 -->
        <div id="loginSection" class="login-section">
            <h2 class="section-title">微信登录</h2>
            
            <div class="form-group">
                <button id="getUuidBtn" class="btn" onclick="getUUID()">获取登录二维码</button>
                <button id="checkStatusBtn" class="btn hidden" onclick="checkLoginStatus()">检查登录状态</button>
            </div>
            
            <div id="qrContainer" class="qr-container hidden">
                <p>请使用微信扫描二维码登录</p>
                <p>（演示版本，实际需要真实的微信二维码）</p>
            </div>
            
            <div id="statusDiv"></div>
        </div>

        <!-- 主功能区域 -->
        <div id="mainSection" class="main-section hidden">
            <h2 class="section-title">微信功能</h2>
            
            <!-- 发送消息 -->
            <div class="form-group">
                <h3>发送消息</h3>
                <label for="toUserId">接收者ID:</label>
                <input type="text" id="toUserId" placeholder="请输入用户ID">
                
                <label for="messageContent">消息内容:</label>
                <textarea id="messageContent" rows="3" placeholder="请输入消息内容"></textarea>
                
                <button class="btn" onclick="sendMessage()">发送消息</button>
            </div>
            
            <!-- 联系人列表 -->
            <div class="form-group">
                <h3>联系人列表</h3>
                <button class="btn" onclick="getContacts()">获取联系人</button>
                <div id="contactsList" class="contacts-list hidden"></div>
            </div>
            
            <!-- 消息同步 -->
            <div class="form-group">
                <h3>消息同步</h3>
                <button class="btn" onclick="syncMessages()">同步消息</button>
                <div id="messagesList" class="messages-list hidden"></div>
            </div>
            
            <div class="form-group">
                <button class="btn" onclick="logout()">退出登录</button>
            </div>
        </div>
    </div>

    <script>
        let currentUUID = '';
        let currentUserId = '';
        let loginCheckInterval = null;
        
        // 显示状态信息
        function showStatus(message, type = 'info') {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }
        
        // 获取UUID并生成二维码
        async function getUUID() {
            try {
                showStatus('正在获取登录二维码...', 'info');
                
                const response = await fetch('/api/wechat/login/uuid');
                const result = await response.json();
                
                if (result.code === 200) {
                    currentUUID = result.data;
                    showStatus('UUID获取成功：' + currentUUID, 'success');
                    await generateQrCode(currentUUID);
                } else {
                    showStatus('获取UUID失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
        
        // 生成二维码
        async function generateQrCode(uuid) {
            try {
                const response = await fetch('/api/wechat/login/qrcode', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `uuid=${encodeURIComponent(uuid)}`
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showStatus('二维码已生成，请使用微信扫码登录（演示模式）', 'success');
                    
                    // 显示二维码容器
                    document.getElementById('qrContainer').classList.remove('hidden');
                    
                    // 显示检查状态按钮
                    document.getElementById('checkStatusBtn').classList.remove('hidden');
                    
                    // 开始定期检查登录状态
                    startLoginCheck();
                } else {
                    showStatus('生成二维码失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
        
        // 开始登录检查
        function startLoginCheck() {
            if (loginCheckInterval) {
                clearInterval(loginCheckInterval);
            }
            
            loginCheckInterval = setInterval(checkLoginStatus, 3000);
        }
        
        // 检查登录状态
        async function checkLoginStatus() {
            try {
                const response = await fetch(`/api/wechat/login/wait?uuid=${currentUUID}&timeout=5`);
                const result = await response.json();
                
                if (result.code === 200) {
                    const status = result.data.status;
                    
                    switch (status) {
                        case 'SUCCESS':
                            showStatus('登录成功！正在初始化...', 'success');
                            await confirmLogin(result.data.redirect_uri || 'mock_redirect_uri');
                            break;
                        case 'SCANNED':
                            showStatus('已扫码，请在手机上确认登录', 'info');
                            break;
                        case 'WAITING':
                            showStatus('等待扫码中...（演示模式，点击此按钮模拟登录）', 'info');
                            break;
                        default:
                            showStatus('等待扫码中...', 'info');
                    }
                }
            } catch (error) {
                console.error('检查登录状态失败:', error);
            }
        }
        
        // 确认登录
        async function confirmLogin(redirectUri) {
            try {
                const response = await fetch('/api/wechat/login/confirm', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Authorization': 'Basic ' + btoa('admin:admin123')
                    },
                    body: `uuid=${encodeURIComponent(currentUUID)}&loginInfo=${encodeURIComponent(redirectUri)}`
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    currentUserId = result.data.userId;
                    showStatus(`登录成功！欢迎 ${result.data.nickname}`, 'success');
                    
                    // 停止登录检查
                    if (loginCheckInterval) {
                        clearInterval(loginCheckInterval);
                        loginCheckInterval = null;
                    }
                    
                    // 切换到主界面
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('mainSection').classList.remove('hidden');
                } else {
                    showStatus('登录失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const toUserId = document.getElementById('toUserId').value.trim();
            const content = document.getElementById('messageContent').value.trim();
            
            if (!toUserId || !content) {
                showStatus('请填写接收者ID和消息内容', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/wechat/message/send', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Id': currentUserId,
                        'Authorization': 'Basic ' + btoa('admin:admin123')
                    },
                    body: JSON.stringify({
                        toUserId: toUserId,
                        content: content,
                        messageType: 'TEXT'
                    })
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showStatus('消息发送成功', 'success');
                    document.getElementById('messageContent').value = '';
                } else {
                    showStatus('消息发送失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
        
        // 获取联系人
        async function getContacts() {
            try {
                const response = await fetch('/api/wechat/contacts', {
                    headers: {
                        'X-User-Id': currentUserId,
                        'Authorization': 'Basic ' + btoa('admin:admin123')
                    }
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    const contactsList = document.getElementById('contactsList');
                    contactsList.innerHTML = '';
                    
                    result.data.forEach(contact => {
                        const item = document.createElement('div');
                        item.className = 'contact-item';
                        item.innerHTML = `
                            <div style="font-weight: 600;">${contact.NickName || contact.UserName}</div>
                            <div style="color: #666; font-size: 0.9rem;">ID: ${contact.UserName}</div>
                        `;
                        
                        // 点击联系人自动填入接收者ID
                        item.onclick = () => {
                            document.getElementById('toUserId').value = contact.UserName;
                            showStatus(`已选择联系人: ${contact.NickName}`, 'info');
                        };
                        
                        contactsList.appendChild(item);
                    });
                    
                    contactsList.classList.remove('hidden');
                    showStatus(`获取到 ${result.data.length} 个联系人`, 'success');
                } else {
                    showStatus('获取联系人失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
        
        // 同步消息
        async function syncMessages() {
            try {
                const response = await fetch('/api/wechat/messages/sync', {
                    headers: {
                        'X-User-Id': currentUserId,
                        'Authorization': 'Basic ' + btoa('admin:admin123')
                    }
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    const messagesList = document.getElementById('messagesList');
                    messagesList.innerHTML = '';
                    
                    if (result.data.length === 0) {
                        messagesList.innerHTML = '<p>暂无新消息</p>';
                    } else {
                        result.data.forEach(message => {
                            const item = document.createElement('div');
                            item.className = 'message-item';
                            item.innerHTML = `
                                <div style="font-weight: 600; color: #667eea;">${message.FromUserName}</div>
                                <div style="margin-top: 5px;">${message.Content}</div>
                                <div style="color: #666; font-size: 0.8rem; margin-top: 5px;">
                                    ${new Date(message.CreateTime * 1000).toLocaleString()}
                                </div>
                            `;
                            messagesList.appendChild(item);
                        });
                    }
                    
                    messagesList.classList.remove('hidden');
                    showStatus(`同步到 ${result.data.length} 条消息`, 'success');
                } else {
                    showStatus('同步消息失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
        
        // 退出登录
        async function logout() {
            try {
                const response = await fetch('/api/wechat/logout', {
                    method: 'POST',
                    headers: {
                        'X-User-Id': currentUserId,
                        'Authorization': 'Basic ' + btoa('admin:admin123')
                    }
                });
                
                const result = await response.json();
                
                if (result.code === 200) {
                    showStatus('退出登录成功', 'success');
                    
                    // 重置状态
                    currentUserId = '';
                    currentUUID = '';
                    
                    // 切换到登录界面
                    document.getElementById('mainSection').classList.add('hidden');
                    document.getElementById('loginSection').classList.remove('hidden');
                    document.getElementById('qrContainer').classList.add('hidden');
                    document.getElementById('checkStatusBtn').classList.add('hidden');
                    
                    // 清空表单
                    document.getElementById('toUserId').value = '';
                    document.getElementById('messageContent').value = '';
                } else {
                    showStatus('退出登录失败: ' + result.message, 'error');
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
